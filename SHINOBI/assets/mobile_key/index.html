<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINOBI - MOBILE_KEY</title>
    <style>
        body {
            background-color: #0D0D0D;
            color: #00FF41;
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            border: 1px solid #FF003C;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.2);
        }
        h1 { color: #FF003C; font-size: 20px; }
        .btn {
            background-color: #FF003C;
            color: black;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        .btn:disabled { background-color: #333; color: #666; }
        #status { margin-top: 20px; font-size: 12px; color: #00E5FF; }
        input {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #00FF41;
            padding: 10px;
            width: 90%;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>忍 SHINOBI 忍<br>MOBILE_KEY_v3.3</h1>

        <div id="setup-area">
            <p>QRコードの設定を貼り付けるか、手動入力してください。</p>
            <input type="text" id="config-input" placeholder='{"u": "...", "c": "...", "t": "..."}'>
            <button class="btn" onclick="saveConfig()">設定を保存</button>
        </div>

        <div id="auth-area" style="display: none;">
            <p>認証準備完了</p>
            <button class="btn" id="unlock-btn">PCを解錠する</button>
            <button class="btn" style="background: #333; color: #aaa; font-size: 12px;" onclick="resetConfig()">設定リセット</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        let shinobiConfig = null;

        function saveConfig() {
            const input = document.getElementById('config-input').value;
            try {
                shinobiConfig = JSON.parse(input);
                localStorage.setItem('shinobi_config', input);
                showAuth();
                log('設定を保存しました。');
            } catch(e) {
                alert('JSON形式が正しくありません。');
            }
        }

        function loadConfig() {
            const saved = localStorage.getItem('shinobi_config');
            if (saved) {
                shinobiConfig = JSON.parse(saved);
                showAuth();
            }
        }

        function showAuth() {
            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('auth-area').style.display = 'block';
        }

        function resetConfig() {
            localStorage.removeItem('shinobi_config');
            location.reload();
        }

        function log(msg) {
            document.getElementById('status').innerText = '> ' + msg;
        }

        document.getElementById('unlock-btn').addEventListener('click', async () => {
            if (!shinobiConfig) return;

            try {
                log('PCを検索中...');
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [shinobiConfig.u] }]
                });

                log('接続中...');
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(shinobiConfig.u);
                const char = await service.getCharacteristic(shinobiConfig.c);

                log('解錠信号を送信中...');
                await char.writeValue(new TextEncoder().encode(shinobiConfig.t));

                log('解錠成功！');
            } catch (error) {
                log('エラー: ' + error.message);
            }
        });

        window.onload = loadConfig;
    </script>
</body>
</html>
